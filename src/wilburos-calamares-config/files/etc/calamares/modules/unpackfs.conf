#
# Unpacks the live squashfs image onto the target system.
#
# The paths below match a standard `mkarchiso` layout
# (/arch/x86_64/airootfs.sfs + /arch/boot/x86_64/vmlinuz-linux on the
# boot medium). If WilburOS's archiso profile.def uses a different
# install_dir / arch, update these paths (and launch.sh) to match.
---
unpack:
    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux"
