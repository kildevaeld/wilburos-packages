#
# Removes live-session-only packages from the installed target.
# Adjust this list to match whatever the WilburOS archiso profile
# actually ships in the squashfs.
---
backend: pacman

skip_if_no_internet: true
update_db: false
update_system: false

pacman:
    num_retries: 3
    disable_download_timeout: false
    needed_only: false

operations:
  - try_remove:
    - calamares
    - mkinitcpio-archiso
