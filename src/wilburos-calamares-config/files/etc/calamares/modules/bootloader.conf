#
# Bootloader configuration for WilburOS.
#
# GRUB is used for both boot modes. Calamares detects the firmware type
# of the (live) host system at runtime and picks the matching grub-install
# invocation itself:
#   - BIOS  -> `grub-install --target=i386-pc <disk>`
#   - UEFI  -> `grub-install --target=x86_64-efi --efi-directory=... --bootloader-id=...`
# No further branching is needed here for that; both cases are covered
# by setting `efiBootLoader: grub` and leaving the EFI system partition
# handling to the `partition` module (see partition.conf).
---
# Bootloader to use when installing on EFI systems.
efiBootLoader: "grub"

# GRUB 2 binary names and boot directory.
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Bootloader ID used for `grub-install --bootloader-id` and as the
# directory name under the EFI System Partition (e.g. /boot/efi/EFI/wilburos).
efiBootloaderId: "wilburos"

# Install a copy of the GRUB EFI bootloader as the EFI fallback loader
# (bootx64.efi / bootia32.efi) so the system still boots on firmware
# that ignores NVRAM boot entries.
installEFIFallback: true

# Only one of BIOS or UEFI GRUB is needed; the correct one is chosen
# based on how the installation media was booted.
installHybridGRUB: false
