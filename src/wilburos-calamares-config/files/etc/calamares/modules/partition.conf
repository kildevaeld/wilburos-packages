#
# Partitioning for WilburOS. Works for both erase-disk (BIOS -> msdos,
# UEFI -> gpt, chosen automatically by Calamares) and manual layouts.
---
# EFI system partition, only created/used when booted in UEFI mode.
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        64MiB
    label:              "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file

swapPartitionName: swap

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
allowManualPartitioning:   true
initialPartitioningChoice: none
initialSwapChoice: none

# Leave unset: gpt is used automatically for UEFI installs, msdos for BIOS.
# defaultPartitionTableType: gpt

defaultFileSystemType:  "ext4"
availableFileSystemTypes:  [ "ext4", "btrfs", "xfs", "f2fs" ]

essentialMounts: [ "live-*", "control" ]

enableLuksAutomatedPartitioning: true
luksGeneration: luks1

lvm:
    enable: true
