#
# Belt-and-suspenders fix so the installed system boots on whatever disk
# controller it actually has, not just whatever the live session happened
# to be using.
#
# mkinitcpio's `autodetect` hook only bundles modules for the storage
# controller(s) it sees active in the *live* session at the moment this
# job runs. If the live medium was booted through one controller (e.g. an
# IDE/AHCI virtual CD-ROM) while the install target disk sits behind a
# different one (e.g. virtio-blk/virtio-scsi in QEMU, or NVMe on real
# hardware), the freshly-built initramfs can end up missing the driver
# needed to find the root filesystem. The installed system then fails to
# boot with something like:
#
#   ALERT! /dev/disk/by-uuid/xxxxxxxx does not exist. Dropping to a shell!
#
# To avoid depending on autodetect guessing right, explicitly add the
# common disk-controller modules to MODULES here (in addition to,
# not instead of, whatever autodetect already finds). This must run
# after `unpackfs` (so /etc/mkinitcpio.conf exists) and before
# `initcpiocfg`/`initcpio` (so the addition is picked up when the
# initramfs is actually built).
---
# Run inside the target chroot.
dontChroot: false
timeout: 30
verbose: true

script:
    - command: >
        sed -i -E 's/^MODULES=\(([^)]*)\)/MODULES=(\1 virtio virtio_blk virtio_scsi virtio_pci ahci nvme sd_mod sr_mod usb_storage uas)/'
        /etc/mkinitcpio.conf

i18n:
     name: "Ensuring mkinitcpio supports common storage controllers..."
